name: Release package

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and dry-run publication without uploading a package
        type: boolean
        default: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      CODEX_API_KEY: ${{ secrets.CODEX_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      # Trusted Publishing (OIDC) needs npm >= 11.5.1; Node 24 ships with it.
      - name: Dry-run publication
        if: inputs.dry_run
        run: |
          npm version prerelease --no-git-tag-version --preid="dry-run.${GITHUB_RUN_ID}"
          npm publish --dry-run --access public --tag dry-run
      - name: Publish package
        if: ${{ !inputs.dry_run }}
        run: npm publish --access public
